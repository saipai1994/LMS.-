# Render Blueprint for a DEMO deployment (fictional Greenwood data, DEMO_MODE=true).
# Not a production configuration. Plans below are Render's free/starter tiers; the free Postgres expires after ~30 days.
databases:
  - name: lms-db
    plan: free
    databaseName: lms
    user: lms
services:
  - type: web
    name: lms-api
    runtime: node
    rootDir: apps/api
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run db:seed && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: lms-db, property: connectionString }
      - key: DEMO_MODE
        value: "true"
      - key: PLATFORM_BOOTSTRAP_TOKEN
        generateValue: true
      - key: DEMO_GATEWAY_SECRET
        generateValue: true
      - key: FILE_STORAGE_DIR
        value: /tmp/lms-files   # ephemeral on free plans: uploaded files vanish on restart
      - key: NODE_VERSION
        value: "22"
  - type: web
    name: lms-web
    runtime: node
    rootDir: apps/web
    plan: free
    buildCommand: npm install && npm run build   # API_URL is read at build time
    startCommand: npx next start -p $PORT
    envVars:
      - key: API_URL
        fromService: { type: web, name: lms-api, property: hostport }
      - key: NODE_VERSION
        value: "22"
