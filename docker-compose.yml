# Local/demo stack. Production: use managed PostgreSQL, TLS termination and real secrets (see docs/DEPLOYMENT.md).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: lms, POSTGRES_PASSWORD: "${DB_PASSWORD:-lms_dev_pw}", POSTGRES_DB: lms }
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U lms"], interval: 5s, retries: 10 }
  api:
    build: ./apps/api
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: "postgres://lms:${DB_PASSWORD:-lms_dev_pw}@db:5432/lms"
      PLATFORM_BOOTSTRAP_TOKEN: "${PLATFORM_BOOTSTRAP_TOKEN:?set a >=24 char secret}"
      DEMO_GATEWAY_SECRET: "${DEMO_GATEWAY_SECRET:-}"
      DEMO_MODE: "${DEMO_MODE:-false}"
      NODE_ENV: "${NODE_ENV:-production}"
    ports: ["3001:3001"]
  web:
    build: { context: ./apps/web, args: { API_URL: "http://api:3001" } }
    depends_on: [api]
    ports: ["3000:3000"]
volumes: { dbdata: {} }
