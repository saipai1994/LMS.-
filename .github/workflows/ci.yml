name: CI
on: { push: { branches: ['**'] }, pull_request: {} }
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: lms, POSTGRES_PASSWORD: lms_dev_pw, POSTGRES_DB: lms_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lms" --health-interval 5s --health-retries 10
    env: { TEST_DATABASE_URL: 'postgres://lms:lms_dev_pw@localhost:5432/lms_test' }
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: lms, POSTGRES_PASSWORD: lms_dev_pw, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lms" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Install API dependencies for browser-test server
        working-directory: apps/api
        run: npm ci
      - name: Create isolated browser-test database
        run: psql 'postgres://lms:lms_dev_pw@localhost:5432/postgres' -v ON_ERROR_STOP=1 -c 'CREATE DATABASE lms_e2e'
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end and accessibility tests
        run: npx playwright test
